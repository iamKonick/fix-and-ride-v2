<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fix&Ride</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #1f2937;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .navbar button {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .navbar button:hover {
            background-color: #b91c1c;
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        h2 {
            color: #1f2937;
            margin-top: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: #f9fafb;
            padding: 1rem;
            border-radius: 4px;
            border-left: 4px solid #2563eb;
        }

        .stat-card h3 {
            margin: 0 0 0.5rem 0;
            color: #6b7280;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .stat-card p {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            background-color: #f9fafb;
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-pending {
            background-color: #fef3c7;
            color: #92400e;
        }

        .status-accepted {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .status-done {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-cancelled {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <h1>🛠️ Fix&Ride Admin</h1>
        <button id="logout-btn">Logout</button>
    </div>

    <div class="container">
        <div class="card">
            <h2>Dashboard</h2>
            <p>Welcome to the Fix&Ride Admin Panel</p>
            <div class="stats">
                <div class="stat-card">
                    <h3>TOTAL BOOKINGS</h3>
                    <p id="total-bookings">-</p>
                </div>
                <div class="stat-card">
                    <h3>ACTIVE USERS</h3>
                    <p id="active-users">-</p>
                </div>
                <div class="stat-card">
                    <h3>PENDING BOOKINGS</h3>
                    <p id="pending-bookings">-</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>All Bookings</h2>
            <div id="bookings-container">
                <div class="loading">Loading bookings...</div>
            </div>
        </div>
    </div>

    <script>
        // Check for token
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('adminToken');
            window.location.href = 'login.html';
        });

        // Format date/time
        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return 'N/A';
            const date = new Date(dateTimeStr);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Get status badge HTML
        function getStatusBadge(status) {
            const statusClass = `status-${status.toLowerCase()}`;
            return `<span class="status-badge ${statusClass}">${status}</span>`;
        }

        // Load bookings
        async function loadBookings() {
            try {
                const response = await fetch('/api/admin/booking', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const bookings = await response.json();

                // Update stats
                document.getElementById('total-bookings').textContent = bookings.length;
                const uniqueUsers = new Set(bookings.map(b => b.user?.email)).size;
                document.getElementById('active-users').textContent = uniqueUsers;
                const pendingCount = bookings.filter(b => b.status === 'PENDING').length;
                document.getElementById('pending-bookings').textContent = pendingCount;

                // Display bookings table
                const container = document.getElementById('bookings-container');

                if (bookings.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #6b7280;">No bookings found.</p>';
                    return;
                }

                const tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Service</th>
                                <th>Start Date/Time</th>
                                <th>End Date/Time</th>
                                <th>Cost</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${bookings.map(booking => `
                                <tr>
                                    <td>#${booking.bookingId}</td>
                                    <td>
                                        <strong>${booking.user?.username || 'N/A'}</strong><br>
                                        <small style="color: #6b7280;">${booking.user?.email || 'N/A'}</small>
                                    </td>
                                    <td>${booking.service?.name || 'N/A'}</td>
                                    <td>${formatDateTime(booking.startDateTime)}</td>
                                    <td>${formatDateTime(booking.endDateTime)}</td>
                                    <td>€${booking.cost || '0.00'}</td>
                                    <td>${getStatusBadge(booking.status)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                container.innerHTML = tableHTML;

            } catch (err) {
                console.error('Error loading bookings:', err);
                const container = document.getElementById('bookings-container');
                container.innerHTML = `
                    <div class="error">
                        <strong>Error loading bookings:</strong> ${err.message}
                    </div>
                `;
            }
        }

        // Load bookings on page load
        loadBookings();
    </script>
</body>

</html>
