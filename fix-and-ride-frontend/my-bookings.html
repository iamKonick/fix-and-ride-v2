<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings - Fix&Ride</title>
  <link rel="stylesheet" href="css/modern.css" />
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">🛠️ Fix&Ride</a>
      <nav>
        <button class="hamburger" id="hamburger">☰</button>
        <ul id="nav-links" class="nav-links">
          <li><a href="index.html#hero">Home</a></li>
          <li><a href="index.html#bio">About</a></li>
          <li><a href="index.html#services">Services</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="user-menu-container flex items-center gap-md">
        <div class="user-menu" id="user-menu">
          <div class="user-avatar" id="user-avatar" tabindex="0">
            <img src="assets/icons/account.png" alt="User Avatar" />
          </div>
          <div class="dropdown-menu" id="dropdown-menu">
            <div class="dropdown-item"><span id="username-display" style="font-weight:600;">User</span></div>
            <a href="profile.html" class="dropdown-item">👤 My Profile</a>
            <a href="my-bookings.html" class="dropdown-item">📅 My Bookings</a>
            <a href="settings.html" class="dropdown-item">⚙️ Settings</a>
            <hr style="border-top:1px solid var(--border-color); margin:5px 0;">
            <a href="#" id="logout-btn" class="dropdown-item" style="color:var(--danger-color);">🚪 Logout</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="min-height: 60vh; padding-top: var(--spacing-xl);">
    <h1>My Bookings</h1>
    <div class="card" style="margin-top: var(--spacing-md); padding: var(--spacing-xl); text-align: center;">
      <p style="font-size: 1.2rem; margin-bottom: var(--spacing-lg);">Your booking history and upcoming jobs will appear
        here.</p>
      <div style="color: var(--text-muted);">Coming Soon...</div>
      <br>
      <a href="index.html#services" class="btn btn-primary">Book a New Service</a>
    </div>
  </main>

  <footer class="footer">
    <div class="container" style="text-align: center;">
      <p>&copy; 2025 Fix&Ride. All rights reserved.</p>
    </div>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>

</html>
